[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phishlens"
version = "1.2.0"
description = "Self-hosted phishing email analyzer: CLI, web interface, IMAP connector"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
phishlens = "phishlens.cli:main"

[tool.setuptools]
packages = ["phishlens", "phishlens.web"]

[tool.setuptools.package-data]
"phishlens.web" = ["static/*"]
