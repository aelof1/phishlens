<VirtualHost *:80>
    # Change this to your domain name or server IP
    ServerName phishlens.example.com

    WSGIDaemonProcess phishlens user=phishlens group=phishlens processes=2 threads=5 request-timeout=180
    WSGIScriptAlias / /opt/phishlens/web/app.wsgi process-group=phishlens application-group=%{GLOBAL}

    <Directory /opt/phishlens/web>
        Require all denied
        <Files app.wsgi>
            # The dashboard shows your emails: a password is required
            AuthType Basic
            AuthName "phishlens"
            AuthUserFile /etc/apache2/phishlens.htpasswd
            Require valid-user
        </Files>
    </Directory>

    LimitRequestBody 2097152
    ErrorLog ${APACHE_LOG_DIR}/phishlens_error.log
    CustomLog ${APACHE_LOG_DIR}/phishlens_access.log combined
</VirtualHost>
